name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests (Dev + chromium)
      run: npx playwright test -c playwright-dev.config.ts --project=chromium
      env:
        PARABANK_PASSWORD: ${{ secrets.PARABANK_PASSWORD }}

    - name: Upload Report & Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-execution-data
        path: |
          playwright-report/
          test-results/
          screenshots/
        retention-days: 30

    - name: Deploy to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
